<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agreement & Modals Quiz</title>
<style>
body{margin:0;padding:24px;background:#f2f6fa;font-family:Arial,sans-serif;color:#26303f;display:flex;justify-content:center}
main{background:white;width:min(760px,100%);padding:28px;border-radius:18px;box-shadow:0 12px 35px #192a4a18}
small{color:#008f96;font-weight:bold;letter-spacing:.08em}h1{color:#192a4a;margin-bottom:4px}.muted{color:#64748b}
.bar{height:8px;background:#e5edf2;border-radius:10px;margin:20px 0;overflow:hidden}#fill{height:100%;background:#008f96;width:0}
#q{font-size:22px;font-weight:bold;line-height:1.4;margin:22px 0}#opts{display:grid;gap:10px}
.opt{background:white;border:2px solid #dce5ec;border-radius:12px;padding:14px;text-align:left;font-size:17px;cursor:pointer}
.opt:disabled{cursor:default;opacity:1}.ok{background:#eef8f2;border-color:#31875f}.no{background:#fff2f1;border-color:#be4b46}
#feedback{display:none;background:#f2f6fa;border-radius:12px;padding:15px;margin-top:16px;line-height:1.5}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
.primary{background:#192a4a;color:white;border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer}.primary:disabled{opacity:.4}
.score{font-size:40px;color:#008f96;font-weight:bold;text-align:center}
</style><main><small>GRAMMAR CHALLENGE</small><h1>Quick grammar quiz</h1><p class="muted">10 questions • Choose an answer and read the feedback.</p>
<div class="bar"><div id="fill"></div></div><section id="game"><p class="muted" id="count"></p><div id="q"></div><div id="opts"></div><div id="feedback"></div><div class="actions"><span class="muted" id="score">Score: 0</span><button class="primary" id="next" disabled>Next question</button></div></section>
<section id="end" style="display:none;text-align:center"><div class="score" id="final"></div><h2>Quiz complete!</h2><p id="msg"></p><button class="primary" onclick="restart()">Play again</button></section></main>
<script>
const data=[["She works at the university.", ["Correct", "Incorrect"], 0, "The subject she is third-person singular, so works is correctly marked."], ["The students is ready for class.", ["Correct", "Incorrect"], 1, "Students is plural, so the sentence should be “The students are ready for class.”"], ["Everyone has a different opinion.", ["Correct", "Incorrect"], 0, "Everyone is an indefinite pronoun treated as singular here."], ["He can speaks Spanish.", ["Correct", "Incorrect"], 1, "A modal is followed by the base form: “He can speak Spanish.”"], ["You must to submit the assignment today.", ["Correct", "Incorrect"], 1, "Must is followed directly by the base form: “You must submit…”"], ["It might rain this evening.", ["Correct", "Incorrect"], 0, "Might is followed by the base form rain."], ["The list of assignments are online.", ["Correct", "Incorrect"], 1, "The head subject list is singular: “The list of assignments is online.”"], ["Students _____ bring food into the laboratory. It is prohibited.", ["don’t have to", "mustn’t", "might", "could"], 1, "Mustn’t expresses prohibition; don’t have to means no necessity."], ["When I was younger, I _____ run five kilometers without stopping.", ["can", "must", "could", "should"], 2, "Could expresses past ability."], ["Which sentence is correct?", ["She should studies more.", "She should to study more.", "She should study more.", "She should studied more."], 2, "The modal should is followed by the base form study."]];let n=0,points=0,locked=false;const el=id=>document.getElementById(id);
function render(){locked=false;let d=data[n];el('count').textContent=`QUESTION ${n+1} OF ${data.length}`;el('q').textContent=d[0];el('opts').innerHTML='';el('feedback').style.display='none';el('next').disabled=true;el('next').textContent=n===data.length-1?'See results':'Next question';el('fill').style.width=(n/data.length*100)+'%';d[1].forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>choose(i);el('opts').appendChild(b)});el('score').textContent=`Score: ${points}`}
function choose(i){if(locked)return;locked=true;let d=data[n];[...document.querySelectorAll('.opt')].forEach((b,k)=>{b.disabled=true;if(k===d[2])b.classList.add('ok');else if(k===i)b.classList.add('no')});if(i===d[2])points++;el('feedback').innerHTML=`<b>${i===d[2]?'That’s right!':'Not quite.'}</b> ${d[3]}`;el('feedback').style.display='block';el('next').disabled=false;el('score').textContent=`Score: ${points}`}
el('next').onclick=()=>{n++;if(n<data.length)render();else{el('game').style.display='none';el('end').style.display='block';el('fill').style.width='100%';el('final').textContent=`${points} / ${data.length}`;el('msg').textContent=points>=8?'Excellent work!':points>=6?'Good effort. Review the explanations for missed items.':'Keep practicing, review the explanations, and try again.'}};
function restart(){n=0;points=0;el('game').style.display='block';el('end').style.display='none';render()}render();
</script></html>
